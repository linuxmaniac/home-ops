---
# from https://github.com/siderolabs/contrib/blob/main/examples/omni/apps/kube-system/cilium/values.yaml
# See https://www.talos.dev/v1.9/kubernetes-guides/network/deploying-cilium/
kubeProxyReplacement: true
ipam:
  mode: kubernetes
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  hostRoot: /sys/fs/cgroup
  autoMount:
    enabled: false
# Enable BGP Control Plane
bgpControlPlane:
  enabled: true
# Enable Cilium Ingress Controller
ingressController:
  enabled: true
# Use KubePrism to access cluster API
k8sServiceHost: localhost
k8sServicePort: 7445
# Enable Hubble
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
    service:
      annotations:
        # Enable Omni Workload Proxying for this service
        omni-kube-service-exposer.sidero.dev/port: '50080'
        omni-kube-service-exposer.sidero.dev/label: Hubble
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - http
  tls:
    auto:
      # enable automatic TLS certificate generation
      enabled: true
      # auto generate certificates using cronJob method
      method: cronJob
      # certificates validity duration in days (default 3 years)
      certValidityDuration: 1095
      # schedule for certificates re-generation (crontab syntax)
      schedule: 0 0 1 */4 *
