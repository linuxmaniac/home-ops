      - patch
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - list
      - watch
  - apiGroups:
      - ''
    resources:
  # To remove node taints
      - nodes
  # To set NetworkUnavailable false on startup
      - nodes/status
    verbs:
      - patch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
  # to perform LB IP allocation for BGP
      - services/status
    verbs:
      - update
      - patch
  - apiGroups:
      - ''
    resources:
  # to check apiserver connectivity
      - namespaces
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
  # to perform the translation of a CNP that contains `ToGroup` to its endpoints
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
      - patch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
      - patch
  - apiGroups:
  # Watch CNP / CCNPs for validation and external groups.
      - cilium.io
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
    verbs:
  # Create auto-generated CNPs and CCNPs from Policies that have 'toGroups'.
  # This was removed in v1.20, but we must keep the permissions until v1.21 for
  # upgrade phasing.
      - create
      - update
      - deletecollection
      - patch
      - get
      - list
      - watch
  - apiGroups:
      - cilium.io
    resources:
      - ciliumnetworkpolicies/status
