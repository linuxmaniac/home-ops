---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../controllers/cilium-helm.yaml
  - ../../pk8s/controllers/descheduler.yaml
  # this needs a working CiliumLoadBalancerIPPool
  - ../../controllers/traefik.yaml
  - ../../controllers/cert-manager-csi-driver.yaml
  - ../../pk8s/controllers/images.yaml
patches:
  - path: cilium-values.yaml
    target:
      kind: HelmRelease
      name: cilium
  - path: traefik-values.yaml
    target:
      kind: HelmRelease
      name: traefik
  - target:
      kind: ImageUpdateAutomation
      name: controllers
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/git/checkout/ref/branch
        value: dev
configMapGenerator:
  - name: cilium-values
    namespace: flux-system
    files:
      - ../../controllers/cilium-values.yaml
configurations:
  - kustomizeconfig.yaml
