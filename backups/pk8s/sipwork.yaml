---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: sipwork
  namespace: velero
spec:
  schedule: '@every 24h'
  useOwnerReferencesInBackup: false
  template:
    csiSnapshotTimeout: 10m
    itemOperationTimeout: 1h
    includedNamespaces:
      - sipwork
    ttl: 360h00m00s
    snapshotVolumes: true
