---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: tw
  namespace: velero
spec:
  schedule: '@every 24h'
  useOwnerReferencesInBackup: false
  template:
    csiSnapshotTimeout: 10m
    itemOperationTimeout: 1h
    labelSelector:
      matchLabels:
        velero.io/backup: tw
    ttl: 360h00m00s
    snapshotVolumes: true
