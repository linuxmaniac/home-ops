---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: comunicacioncientifica.info
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`comunicacioncientifica.info`, `www.comunicacioncientifica.info`) && (Path(`/wp-login.php`) || Path(`/login/`) || Path(`/lostpassword/`)
        || PathPrefix(`/wp-admin`))
      kind: Rule
      priority: 100
      middlewares:
        - name: internal-ipallowlist
          namespace: traefik
      services:
        - name: wp-wordpress
          kind: Service
          port: http
          namespace: umh
    - match: HostRegexp(`{host:.+}`)
      kind: Rule
      priority: 10
      services:
        - name: wp-wordpress
          kind: Service
          port: http
          namespace: umh
  tls:
    secretName: comunicacioncientifica.info-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: comunicacioncientifica.info-http
  namespace: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`comunicacioncientifica.info`, `www.comunicacioncientifica.info`)
      kind: Rule
      middlewares:
        - name: redirectscheme
          namespace: traefik
      services:
        - name: noop@internal
          kind: TraefikService
          namespace: traefik
