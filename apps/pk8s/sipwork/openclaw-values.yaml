image:
  repository: ghcr.io/openclaw/openclaw
  tag: 2026.11.10 # {"$imagepolicy": "sipwork:openclaw:tag"}
openclaw:
  bind: lan
  timezone: Europe/Madrid
  configOverrides:
    gateway:
      controlUi:
        allowedOrigins:
          - https://claw.sipwork.pro
chromium:
  enabled: true
persistence:
  enabled: true
  existingClaim: openclaw
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirectscheme@kubernetescrd
    traefik.frontend.passHostHeader: 'true'
  hosts:
    - host: claw.sipwork.pro
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - claw.sipwork.pro
      secretName: sipwork.pro-tls
