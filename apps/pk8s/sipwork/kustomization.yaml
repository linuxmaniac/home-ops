---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  labels:
    app.kubernetes.io/sops: enabled
resources:
  - certificate.yaml
  - traefik.yaml
  - storage.yaml
  - services_ext.yaml
  - ingress.yaml
  - open-webui.yaml
  - openclaw.yaml
secretGenerator:
  - name: openclaw-config
    namespace: flux-system
    files:
      - values.yaml=openclaw_secret-values.enc.yaml
configMapGenerator:
  - name: open-webui-values
    namespace: flux-system
    files:
      - values-open-webui.yaml=open-webui-values.yaml
  - name: openclaw-values
    namespace: flux-system
    files:
      - values-openclaw.yaml=openclaw-values.yaml
configurations:
  - kustomizeconfig.yaml
