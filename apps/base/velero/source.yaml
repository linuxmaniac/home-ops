---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: helmforgedev
  namespace: flux-system
spec:
  interval: 12h
  type: oci
  url: oci://ghcr.io/helmforgedev/helm
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 6h
  chart: velero
  reconcileStrategy: ChartVersion
  sourceRef:
    kind: HelmRepository
    name: helmforgedev
  version: 1.7.x
