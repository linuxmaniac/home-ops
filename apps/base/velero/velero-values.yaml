---
credentials:
  useSecret: true
  name: cloud-minio
configuration:
  features: EnableCSI
  backupStorageLocations:
    - name: default
      provider: aws
      bucket: pk8s-velero
      default: true
      config:
        region: minio
        s3ForcePathStyle: true
        checksumAlgorithm: ''
        insecureSkipTLSVerify: true
        s3Url: https://truenas.lab:9000
  volumeSnapshotLocations: []
deployNodeAgent: false
snapshotsEnabled: false
