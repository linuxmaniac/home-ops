---
credentials:
  useSecret: true
  name: cloud-minio
configuration:
  backupStorageLocations:
    - name: default
      provider: aws
      bucket: pk8s-velero
      credential:
        name: cloud-minio
        key: cloud
      config:
        region: minio
        s3ForcePathStyle: true
        checksumAlgorithm: ''
        insecureSkipTLSVerify: true
        s3Url: http://truenas.lab:9000
  volumeSnapshotLocations:
    - name: default
      provider: aws
      bucket: pk8s-velero
      credential:
        name: cloud-minio
        key: cloud
      config:
        region: minio
        s3ForcePathStyle: true
        checksumAlgorithm: ''
        insecureSkipTLSVerify: true
        s3Url: http://truenas.lab:9000
deployNodeAgent: false
