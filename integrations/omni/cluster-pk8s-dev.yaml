---
kind: Cluster
name: pk8s-dev
talos:
  version: v1.14.5
kubernetes:
  version: 1.37.1
  manifests:
    - name: cilium
      file: cilium.yaml
      mode: one-time
features:
  enableWorkloadProxy: true
  backupConfiguration:
    interval: 24h
patches:
  - name: no-cni
    file: patches/cni.yml
labels:
  env: dev
---
kind: ControlPlane
machineClass:
  name: proxmox-cp-auto
  size: 3
patches:
  - name: disable-kubeproxy
    file: patches/disable-kubeproxy.yml
  - name: exta-manifests
    file: patches/extraManifests.yml
  - name: metric-server
    file: patches/metrics-server.yml
  - name: monitoring
    file: patches/monitoring.yml
  - name: security namespace exceptions
    file: patches/exceptions.yml
  - name: kubelet
    file: patches/kubelet-nodeip-cp.yml
systemExtensions:
  - siderolabs/qemu-guest-agent
---
kind: Workers
machineClass:
  name: proxmox-worker-auto
  size: 2
patches:
  - name: security
    file: patches/security.yml
  - name: metric-server
    file: patches/metrics-server.yml
  - name: kubelet
    file: patches/kubelet-nodeip.yml
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
  - siderolabs/qemu-guest-agent
