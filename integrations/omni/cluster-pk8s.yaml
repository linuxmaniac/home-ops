---
kind: Machine
name: d92c1c15-a61d-e53c-f392-a0f566506566 # k3s-node3
labels:
  pk8s: wk
locked: false
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
  - siderolabs/amd-ucode
  - siderolabs/amdgpu
  - siderolabs/realtek-firmware
  - siderolabs/nut-client
patches:
  - name: network
    file: patches/node3/network.yml
  - name: nut-client
    file: patches/nut.yml
---
kind: Machine
name: f6ab382a-171c-11ee-9a2d-f3300775a202 # k3s-node5
labels:
  pk8s: wk
locked: false
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
  - siderolabs/amd-ucode
  - siderolabs/amdgpu
  - siderolabs/realtek-firmware
  - siderolabs/nut-client
patches:
  - name: network
    file: patches/node5/network.yml
  - name: nut-client
    file: patches/nut.yml
