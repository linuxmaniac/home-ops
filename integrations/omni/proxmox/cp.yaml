---
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: proxmox-cp-auto
spec:
  autoprovision:
    providerid: proxmox
    providerdata: |
      cores: 2
      sockets: 1
      memory: 4096
      disk_size: 15
      disk_ssd: true
      disk_iothread: true
      balloon: true
      vlan: 100
      bios: ovmf
      storage_selector: 'name == "shared"'
      node: pve02
