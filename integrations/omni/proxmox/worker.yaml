---
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: proxmox-worker-auto
spec:
  autoprovision:
    providerid: proxmox
    providerdata: |
      cores: 4
      sockets: 1
      memory: 8192
      disk_size: 40
      vlan: 100
      bios: ovmf
      storage_selector: 'name == "shared"'
      node: pve01
      additional_nics:
        - bridge: vmbr1
