---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: lab0
selector:
  match: glob("b0:41:6f:*", mac(link.permanent_addr))
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: nas0
selector:
  match: glob("00:e0:4c:*", mac(link.permanent_addr))
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: lab0
clientIdentifier: mac
---
apiVersion: v1alpha1
kind: LinkConfig
name: nas0
up: true
mtu: 9000
addresses:
  - address: 192.168.10.2/30
routes:
  - destination: 192.168.10.12/30
    gateway: 192.168.10.1
